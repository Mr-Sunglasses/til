name: Deploy site to Netlify

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the merged site
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Tiller cache
        id: tiller-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tiller
          key: ${{ runner.os }}-tiller-cli-v1

      - name: Install Tiller
        if: steps.tiller-cache.outputs.cache-hit != 'true'
        run: cargo install tiller --locked

      - name: Generate the site
        run: make build

      - name: Deploy the generated site
        run: npx --yes netlify-cli deploy --dir=site --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
